image: atlassian/default-image:latest

pipelines:
  branches:
    main:
      - step:
          name: Deploy to Internal Contabo
          deployment: Dev
          script:
            - echo "Deploying to Dev..."
            - apt-get update && apt-get install -y sshpass
            - sshpass -p "$SERVER_PASS" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" "/home/comsense/projects/flying-flea-doi-integration/deploy.sh"